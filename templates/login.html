<!DOCTYPE html>
<html>
<head>
    <title>Login - Inno Mind Academy</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .login-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; width: 100%; max-width: 350px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #bdc3c7; border-radius: 5px; box-sizing: border-box; }
        button { background-color: #3498db; color: white; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; font-size: 16px; margin-top: 10px; transition: 0.2s; }
        button:hover { background-color: #2980b9; }
        .error { color: #e74c3c; font-size: 14px; margin-bottom: 10px; background: #fee; padding: 10px; border-radius: 5px; }
        .success { color: #27ae60; font-size: 14px; margin-bottom: 10px; background: #e8f8f5; padding: 10px; border-radius: 5px; }
        .footer-text { margin-top: 20px; font-size: 14px; color: #7f8c8d; }
        .footer-text a { color: #3498db; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2 style="margin-top: 0; color: #2c3e50;">Inno Mind Academy</h2>
        <p style="color: #7f8c8d; font-size: 14px; margin-bottom: 20px;">Student Portal Login</p>
        
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% if 'successful' in messages[0] %}
                <div class="success">{{ messages[0] }}</div>
            {% else %}
                <div class="error">{{ messages[0] }}</div>
            {% endif %}
          {% endif %}
        {% endwith %}

        <form method="POST" action="/login">
            <input type="email" name="email" placeholder="Student Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">LOGIN</button>
        </form>

        <div class="footer-text">
            Don't have an account? <a href="/register">Register here</a>
        </div>
    </div>
</body>
</html>
