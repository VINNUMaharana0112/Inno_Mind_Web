<!DOCTYPE html>
<html>
<head>
    <title>Register - Inno Mind Academy</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .login-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; width: 100%; max-width: 350px; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #bdc3c7; border-radius: 5px; box-sizing: border-box; font-family: inherit; }
        button { background-color: #2ecc71; color: white; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; font-size: 16px; margin-top: 10px; transition: 0.2s; }
        button:hover { background-color: #27ae60; }
        .error { color: #e74c3c; font-size: 14px; margin-bottom: 10px; background: #fee; padding: 10px; border-radius: 5px; }
        .footer-text { margin-top: 20px; font-size: 14px; color: #7f8c8d; }
        .footer-text a { color: #3498db; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2 style="margin-top: 0; color: #2c3e50;">Join Inno Mind</h2>
        <p style="color: #7f8c8d; font-size: 14px; margin-bottom: 20px;">Create your student account.</p>
        
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="error">{{ messages[0] }}</div>
          {% endif %}
        {% endwith %}

        <form method="POST" action="/register">
            <input type="text" name="name" placeholder="Full Name" required>
            <input type="email" name="email" placeholder="Email Address" required>
            <input type="text" name="phone" placeholder="Phone Number" required>
            
            <select name="course" required>
                <option value="" disabled selected>Target Course...</option>
                <option value="IPMAT 2026">IPMAT 2026</option>
                <option value="CLAT 2026">CLAT 2026</option>
                <option value="OPSC">OPSC</option>
            </select>

            <input type="password" name="password" placeholder="Create Password" required>
            
            <button type="submit">CREATE ACCOUNT</button>
        </form>

        <div class="footer-text">
            Already have an account? <a href="/login">Log in here</a>
        </div>
    </div>
</body>
</html>
