<!DOCTYPE html>
<html>
<head>
    <title>Live Exam - {{ institute.name }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding-bottom: 50px; }
        
        /* Floating Sticky Timer */
        .timer-header { position: sticky; top: 0; background-color: #2c3e50; color: #f1c40f; padding: 15px; text-align: center; font-size: 24px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); z-index: 100; border-bottom: 4px solid #e74c3c; }
        
        .exam-container { max-width: 800px; margin: 20px auto; padding: 0 15px; }
        .question-card { background: white; padding: 25px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 5px solid #3498db; }
        
        .q-header { font-weight: bold; color: #7f8c8d; margin-bottom: 15px; font-size: 14px; text-transform: uppercase; }
        .q-text { font-size: 16px; color: #2c3e50; margin-bottom: 20px; line-height: 1.5; }
        
        /* MCQ Options */
        .option-row { display: flex; align-items: center; padding: 10px; border: 1px solid #ecf0f1; border-radius: 5px; margin-bottom: 8px; cursor: pointer; transition: 0.2s; }
        .option-row:hover { background-color: #f8f9fa; }
        .option-row input[type="radio"] { margin-right: 15px; transform: scale(1.2); }
        
        /* Descriptive Textarea */
        textarea { width: 100%; height: 120px; padding: 10px; border: 1px solid #bdc3c7; border-radius: 5px; font-family: inherit; font-size: 14px; box-sizing: border-box; resize: vertical; }
        .word-counter { text-align: right; font-size: 12px; color: #3498db; font-weight: bold; margin-top: 5px; }
        
        .submit-btn { background-color: #2ecc71; color: white; border: none; padding: 15px 30px; font-size: 18px; font-weight: bold; border-radius: 30px; cursor: pointer; width: 100%; box-shadow: 0 4px 10px rgba(46, 204, 113, 0.3); transition: 0.3s; }
        .submit-btn:hover { background-color: #27ae60; transform: translateY(-2px); }
    </style>
</head>
<body>

    <div class="timer-header" id="timerDisplay">
        Time Remaining: --:--
    </div>

    <div class="exam-container">
        <form id="examForm" action="/submit_exam" method="POST" enctype="multipart/form-data">
            
            {{ exam_html | safe }}
            
            <div style="background: #e8f8f5; padding: 20px; border-radius: 10px; margin-bottom: 20px; border-left: 5px solid #2ecc71; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
                <div style="font-weight: bold; color: #27ae60; margin-bottom: 10px; font-size: 18px;">📸 Descriptive Attachments (Optional)</div>
                <div style="font-size: 14px; color: #34495e; margin-bottom: 15px;">Taking a hybrid test? Snap a photo of your handwritten answer sheet and upload it here for the examiner.</div>
                <input type="file" name="attachment" accept="image/png, image/jpeg, image/jpg" style="padding: 10px; background: white; border-radius: 5px; width: 100%; border: 1px solid #bdc3c7; box-sizing: border-box;">
            </div>
            
            <button type="button" class="submit-btn" onclick="confirmSubmit()">SUBMIT EXAM</button>
        </form>
    </div>

    <script>
        // 1. Word Counter Engine
        function updateWordCount(index) {
            const text = document.getElementById('desc_' + index).value.trim();
            const count = text === "" ? 0 : text.split(/\s+/).length;
            document.getElementById('count_' + index).innerText = "Words: " + count;
        }

        // 2. Countdown Timer Engine
        let timeLeft = {{ timer * 60 }}; 
        const timerDisplay = document.getElementById('timerDisplay');
        const examForm = document.getElementById('examForm');

        function updateTimer() {
            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;
            
            // Add leading zero
            minutes = minutes < 10 ? "0" + minutes : minutes;
            seconds = seconds < 10 ? "0" + seconds : seconds;
            
            timerDisplay.innerText = "Time Remaining: " + minutes + ":" + seconds;
            
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                timerDisplay.innerText = "TIME UP!";
                timerDisplay.style.color = "white";
                timerDisplay.style.backgroundColor = "#e74c3c";
                alert("Time is up! Your exam is being automatically submitted.");
                examForm.submit(); // Force submission
            }
            timeLeft--;
        }
        
        // Run the timer every 1 second
        const timerInterval = setInterval(updateTimer, 1000);
        updateTimer(); // Initialize immediately

        // 3. Manual Submission Check
        function confirmSubmit() {
            if(confirm("Are you sure you are ready to submit your exam?")) {
                examForm.submit();
            }
        }
    </script>
</body>
</html>
